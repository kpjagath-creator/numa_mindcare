services:
  - type: web
    name: numa-mindcare-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node build/app.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://numa-mindcare.vercel.app
      - key: NODE_ENV
        value: production
      # Clinic timezone (TZ-01). Scheduling converts clinic wall-clock input to absolute instants
      # explicitly, so correctness does not depend on the container's timezone — but stating it
      # here keeps the deployment self-documenting.
      - key: CLINIC_TIME_ZONE
        value: Asia/Kolkata
      # Google Calendar / Meet integration (MEET-01). Secrets - set in the Render dashboard,
      # never committed. See backend/.env.example for the OAuth production-publishing
      # prerequisite (refresh tokens expire after 7 days while the app is in "Testing").
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_CALENDAR_TIMEZONE
        value: Asia/Kolkata
